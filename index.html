<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>소프트웨어 동아리 - 사이버 폭력 정화 프로젝트</title>

<style>
    body {
        background-color: #000;
        color: #ff1111;
        font-family: 'Pretendard', sans-serif;
        margin: 0;
        overflow: hidden;
    }

    #tv-screen {
        height: 75vh;
        position: relative;
        border-bottom: 3px solid #222;
        background: #050000;
        overflow: hidden;
    }

    /* ⚠ 악플 */
    .bad {
        position: absolute;
        white-space: nowrap;
        font-weight: 800;
        color: #ff3333;
        font-size: 2.5rem;
        opacity: 0.35;
        animation: drift-bad linear forwards;
    }

    @keyframes drift-bad {
        from { left: 110%; }
        to { left: -150%; }
    }

    /* ✨ 고운말 */
    .good {
        position: absolute;
        white-space: nowrap;
        font-weight: 900;
        color: #00ff88;
        text-shadow: 0 0 30px #00ff88;
        z-index: 100;
        animation: drift-good linear forwards;
    }

    @keyframes drift-good {
        from { left: 110%; }
        to { left: -250%; }
    }

    /* 입력창 영역 */
    #input-area {
        height: 25vh;
        background: #0a0a0a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-top: 2px solid #00ff88;
    }

    #status-msg {
        color: #00ff88;
        margin-bottom: 10px;
        font-weight: bold;
        font-size: 1.2rem;
        font-family: 'Courier New', monospace;
    }

    /* 게이지 */
    #progress-container {
        width: 85%;
        height: 20px;
        background: #222;
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 15px;
        border: 1px solid #00ff88;
    }

    #progress-bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #00ff88, #66ffcc, #00ff88);
        background-size: 200% 100%;
        box-shadow: 0 0 15px #00ff88;
        transition: width 0.5s ease;
        animation: flow 2s linear infinite;
        position: relative;
        overflow: hidden;
    }

    #progress-bar::after {
        content: "";
        position: absolute;
        top: 0;
        left: -30%;
        width: 30%;
        height: 100%;
        background: rgba(255,255,255,0.5);
        transform: skewX(-25deg);
        animation: shine 1.5s infinite;
    }

    @keyframes flow {
        0% { background-position: 0% 0; }
        100% { background-position: 200% 0; }
    }

    @keyframes shine {
        0% { left: -30%; }
        100% { left: 130%; }
    }

    .input-box {
        display: flex;
        width: 85%;
        gap: 10px;
    }

    input {
        flex: 1;
        font-size: 1.5rem;
        padding: 15px;
        border: 2px solid #00ff88;
        background: #000;
        color: #fff;
        border-radius: 8px;
        outline: none;
    }

    button {
        font-size: 1.5rem;
        padding: 0 40px;
        background: #00ff88;
        color: #000;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
    }

    button:active {
        transform: scale(0.98);
    }

    /* 완료 화면 */
    #success-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 255, 136, 0.95);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        color: #000;
        animation: fadeIn 1.5s ease-in-out forwards;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .success-text {
        font-size: 6rem;
        font-weight: 900;
        margin-bottom: 20px;
        text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
    }

    .sub-text {
        font-size: 2.5rem;
        font-weight: 700;
    }
</style>
</head>

<body>

<div id="success-overlay">
    <div class="success-text">✨ 완벽해요! ✨</div>
    <div class="sub-text">사이버 세상이 깨끗하게 정화되었습니다.</div>
</div>

<div id="tv-screen"></div>

<div id="input-area">

    <div id="status-msg">
        SW CLUB PURIFICATION SYSTEM :
        <span id="percent">0</span>% 
        (<span id="count">0</span>/100)
    </div>

    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>

    <div class="input-box">
        <input type="text"
               id="reply-input"
               placeholder="이곳에 정화 로직(응원 메시지)을 입력하세요..."
               onkeypress="if(event.keyCode==13) injectPurifier()">

        <button onclick="injectPurifier()">업데이트</button>
    </div>

</div>

<script>

const badPhrases = [
    "춤 왜 저래? 진짜 기괴함",
    "노래 실력 실화? 귀 테러 오짐",
    "진짜 노답이다 ㅋㅋㅋ",
    "애쓴다 진짜... 저게 멋있나?",
    "코디 실화냐? 진짜 할말하않",
    "뚝딱거리는 거 보소 ㅋㅋㅋ",
    "실력도 없으면서 자신감은 뭐임?",
    "말투 극혐이다 진짜 바로 끔",
    "영상 내리는 게 나을 듯",
    "누가 너 좋대? 혼자 착각 지리네",
    "열심히는 하는데 진짜 안쓰럽다",
    "쟤는 왜 맨날 저래? 눈치 좀",
    "아 진짜 극혐 ㅋㅋㅋ 분위기 다 흐리네",
    "응 니 생각 아무도 안 궁금해~",
    "실수 좀 적당히 해라 짜증남"
];

const goodPhrases = [];

const tv = document.getElementById('tv-screen');

let totalPurified = 0;
let isFinished = false;

/* 현재 떠있는 악플 저장 */
let activeBadComments = [];

/* ⚠ 악플 생성 */
const badInterval = setInterval(() => {

    if (isFinished) return;

    const div = document.createElement('div');

    div.className = 'bad';

    div.innerText =
        badPhrases[Math.floor(Math.random() * badPhrases.length)];

    div.style.top = Math.random() * 85 + "%";

    div.style.animationDuration =
        (Math.random() * 5 + 10) + "s";

    tv.appendChild(div);

    activeBadComments.push(div);

    setTimeout(() => {

        div.remove();

        activeBadComments =
            activeBadComments.filter(v => v !== div);

    }, 16000);

}, 200);

/* ✨ 고운말 반복 생성 */
const goodInterval = setInterval(() => {

    if (goodPhrases.length === 0 || isFinished) return;

    const div = document.createElement('div');

    div.className = 'good';

    /* 저장된 고운말 랜덤 선택 */
    const randomGood =
        goodPhrases[
            Math.floor(Math.random() * goodPhrases.length)
        ];

    div.innerText = "⭐ " + randomGood + " ⭐";

    /* 랜덤 위치 */
    div.style.top =
        (Math.random() * 75) + "%";

    /* 랜덤 크기 */
    div.style.fontSize =
        (Math.random() * 2 + 2.5) + "rem";

    /* 랜덤 속도 */
    div.style.animationDuration =
        (Math.random() * 10 + 12) + "s";

    /* 약간 더 밝게 */
    div.style.opacity = "0.9";

    tv.appendChild(div);

    setTimeout(() => {
        div.remove();
    }, 25000);

}, 2000);


/* ✨ 정화 시스템 */
function injectPurifier() {

    const input = document.getElementById('reply-input');
    const pText = document.getElementById('percent');
    const cText = document.getElementById('count');
    const pBar = document.getElementById('progress-bar');

    if (input.value.trim() === "" || totalPurified >= 100) return;

    const text = input.value;

    totalPurified++;

    pText.innerText = totalPurified;
    cText.innerText = totalPurified;

    pBar.style.width = totalPurified + "%";

    /* ✨ 게이지 반응 */
    pBar.animate([
        { transform: "scaleY(1)" },
        { transform: "scaleY(1.5)" },
        { transform: "scaleY(1)" }
    ], {
        duration: 300
    });

    /* ✨ 고운말 출력 */
    sendGoodLog(text);

    goodPhrases.push(text);

    /* 이미 제거된 악플 정리 */
    activeBadComments =
        activeBadComments.filter(el => document.body.contains(el));

    /* ✨ 10개마다 악플 제거 */
    if (totalPurified % 10 === 0 && activeBadComments.length > 0) {

        /* 랜덤 악플 선택 */
        const randomIndex =
            Math.floor(Math.random() * activeBadComments.length);

        const bad =
            activeBadComments[randomIndex];

        activeBadComments.splice(randomIndex, 1);

        /* 삭제 강조 */
        bad.style.zIndex = "999";
        bad.style.opacity = "1";

        const rect = bad.getBoundingClientRect();

        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;

        const moveX =
            centerX - (rect.left + rect.width / 2);

        const moveY =
            centerY - (rect.top + rect.height / 2);

        bad.animate([
            {
                transform: "scale(1)",
                opacity: 1,
                filter: "blur(0px)"
            },
            {
                transform:
                    `translate(${moveX}px, ${moveY}px)
                    scale(2)
                    rotate(10deg)`,
                opacity: 1,
                filter: "drop-shadow(0 0 30px red)"
            },
            {
                transform:
                    `translate(${moveX}px, ${moveY}px)
                    scale(0)
                    rotate(720deg)`,
                opacity: 0,
                filter: "blur(15px)"
            }
        ], {
            duration: 1200,
            easing: "ease-in-out"
        });

        /* 💥 정화 폭발 */
        const flash = document.createElement("div");

        flash.style.position = "fixed";
        flash.style.left = "50%";
        flash.style.top = "50%";
        flash.style.width = "300px";
        flash.style.height = "300px";
        flash.style.transform = "translate(-50%, -50%)";
        flash.style.borderRadius = "50%";

        flash.style.background =
            "radial-gradient(circle, rgba(0,255,136,0.9) 0%, rgba(0,255,136,0) 70%)";

        flash.style.pointerEvents = "none";
        flash.style.zIndex = "2000";

        document.body.appendChild(flash);

        flash.animate([
            {
                transform: "translate(-50%, -50%) scale(0.3)",
                opacity: 1
            },
            {
                transform: "translate(-50%, -50%) scale(2)",
                opacity: 0
            }
        ], {
            duration: 800,
            easing: "ease-out"
        });

        setTimeout(() => {
            flash.remove();
            bad.remove();
        }, 1200);
    }

    /* 🎉 완료 */
    if (totalPurified === 100) {

        isFinished = true;

        setTimeout(() => {

            document.getElementById('success-overlay').style.display = 'flex';

        }, 800);
    }

    input.value = "";
    input.focus();
}

/* ✨ 고운말 생성 */
function sendGoodLog(content) {

    const div = document.createElement('div');

    div.className = 'good';

    div.innerText = "⭐ " + content + " ⭐";

    /* 랜덤 위치 */
    div.style.top =
        (Math.random() * 75) + "%";

    /* 랜덤 크기 */
    div.style.fontSize =
        (Math.random() * 2 + 3) + "rem";

    /* 랜덤 속도 */
    div.style.animationDuration =
        (Math.random() * 10 + 15) + "s";

    tv.appendChild(div);

    setTimeout(() => div.remove(), 26000);
}

</script>

</body>
</html>
